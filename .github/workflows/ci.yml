name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

# Annule les runs précédents sur la même branche si un nouveau push arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND
# compile → unit tests → integration tests → JaCoCo → package
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reactiveblog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reactiveblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: reactiveblog
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn compile -DskipTests --no-transfer-progress

      - name: Unit Tests
        working-directory: backend
        run: mvn test --no-transfer-progress

      - name: Integration Tests
        working-directory: backend
        run: mvn failsafe:integration-test failsafe:verify --no-transfer-progress

      - name: Coverage Report (JaCoCo)
        working-directory: backend
        run: mvn jacoco:report --no-transfer-progress

      - name: Package
        working-directory: backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload — Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload — JaCoCo Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/

      - name: Upload — JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

# ─────────────────────────────────────────────────────────────────────────────
# FRONTEND
# lint → tests → build
# ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Nécessite ESLint configuré : ng add @angular-eslint/schematics
        run: npm run lint
        continue-on-error: true

      - name: Tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration=production

      - name: Upload — Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY / QUALITY
# SonarQube — dépend du backend pour le rapport JaCoCo
# ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality — SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]
    # Ne tourne que si SONAR_TOKEN est configuré dans les secrets du repo
    if: ${{ vars.SONAR_HOST_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requis par SonarQube pour l'analyse des blame/history

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Download JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/

      - name: SonarQube Scan
        working-directory: backend
        run: |
          mvn sonar:sonar \
            --no-transfer-progress \
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.source=21
