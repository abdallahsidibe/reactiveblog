services:
  postgres:
    image: postgres:16-alpine
    container_name: reactiveblog-postgres
    environment:
      POSTGRES_DB: reactiveblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reactiveblog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis : cache réactif ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reactiveblog-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
