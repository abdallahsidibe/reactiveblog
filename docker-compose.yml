services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reactiveblog-postgres
    environment:
      POSTGRES_DB: reactiveblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reactiveblog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis : cache réactif ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reactiveblog-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reactiveblog-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reactiveblog
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend Angular ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reactiveblog-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
