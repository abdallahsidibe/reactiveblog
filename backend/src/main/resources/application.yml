spring:
  application:
    name: reactive-blog

  # ── Redis : cache réactif (Lettuce) ──────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

    # ── MongoDB : base de données réactive (schemaless) ──────────────────────
    # Spring Boot auto-configure le MongoClient réactif à partir de cette URI.
    # Pas de Flyway, pas de JDBC : connexion unique, entièrement non-bloquante.
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:reactiveblog}

server:
  port: 8080

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    com.reactiveblog: INFO
